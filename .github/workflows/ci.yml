name: CI

on:
  push:
  pull_request:

# Новый коммит в ту же ветку или тот же PR отменяет прежний запуск: проверяем только последнее состояние.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Audit, lint, types, tests, build
    # Версия образа закреплена: ubuntu-latest однажды сменился на 26.04, Playwright 1.56 его не знает,
    # и браузерные тесты молча перестали запускаться. Обновляем образ вместе с Playwright, а не сам собой.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Уязвимости высокой и критической важности в том, что попадает на сайт (без инструментов разработки).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run format:check
      - run: npm run build

  e2e:
    name: Browser tests and budgets
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Все тесты в браузере, включая бюджеты: экран задачи и упражнения, длина главных, область нажатия,
      # доступность (axe), вес скриптов и «страница не прыгает» (e2e/ux.spec.ts, e2e/perf.spec.ts).
      - run: npm run test:e2e
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
      # Замер скорости — для сведения: числа на общих машинах CI шумят, поэтому шаг сборку не роняет.
      # Смотреть в сводке запуска; сравнивать имеет смысл только запуски между собой.
      - name: Web vitals (informational)
        continue-on-error: true
        run: |
          npm run start -- -p 3100 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          {
            echo '### Скорость страниц (телефон, сеть 1,6 Мбит/с, процессор ×4 медленнее)'
            echo '```'
            node scripts/web-vitals.mjs / /chess /chess/course /week/1/day/1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
